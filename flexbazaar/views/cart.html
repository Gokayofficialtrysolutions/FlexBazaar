<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbazaar - Your Shopping Cart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Shopping Cart</h1>

    <section id="cart-items">
        <h2>Your Items</h2>
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Golden Widget</td>
                    <td>$29.99</td>
                    <td>2</td>
                    <td>$59.98</td>
                </tr>
                <tr>
                    <td>Luxury Gear</td>
                    <td>$199.50</td>
                    <td>1</td>
                    <td>$199.50</td>
                </tr>
                <!-- More items can be added here -->
            </tbody>
        </table>
    </section>

    <!-- Proceed to Checkout Button Placeholder -->
    <section id="proceed-to-checkout">
        <h2>Checkout</h2>
        <button>Proceed to Checkout</button> <!-- Added a styled button -->
    </section>
    </div>
    <script src="/js/script.js" defer></script>
</body>
</html>
